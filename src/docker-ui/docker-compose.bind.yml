# Override file for bind-mount storage (per-service path configuration)
# Usage: docker compose -f docker-compose.yml -f docker-compose.bind.yml up -d
#
# This replaces the named volume `data` with a host bind-mount,
# allowing you to store data in a specific directory (e.g., NAS, local SSD).
#
# Configure paths in .env file:
#   HOST_PORTAINER_DATA=/mnt/storage/docker-ui/portainer
#
# Default path (if not set): ./docker-volumes/docker-ui/portainer

services:
  portainer:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_PORTAINER_DATA:-./docker-volumes/docker-ui/portainer}:/data
