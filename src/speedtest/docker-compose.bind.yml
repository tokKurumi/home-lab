# Bind-mount override for OpenSpeedTest (ADVANCED)
# Use this file for maximum flexibility - configure volume path independently
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.bind.yml up -d
#
# Benefits:
#   - Point volume to different drives/NAS shares
#   - Full control over storage location
#   - Can use network storage (NFS, CIFS/SMB)
#
# Note: Path matches docker-compose.volumes.yml structure but allows per-volume customization

services:
  openspeedtest:
    volumes:
      - ${HOST_SPEEDTEST_APPDATA:-./docker-volumes/speedtest/openspeedtest/appdata}:/appdata
