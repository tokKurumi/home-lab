# Bind-mount override for Nginx Proxy Manager (ADVANCED)
# Use this file for maximum flexibility - configure each volume path independently
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.bind.yml up -d
#
# Benefits:
#   - Point each volume to different drives/NAS shares
#   - Granular control over storage location
#   - Can mix local and network storage
#
# Note: Paths match docker-compose.volumes.yml structure but allow per-volume customization

services:
  nginx-proxy-manager:
    volumes:
      - ${HOST_NGINX_PROXY_MANAGER_DATA:-./docker-volumes/proxy/nginx-proxy-manager/data}:/data
      - ${HOST_NGINX_PROXY_MANAGER_LETSENCRYPT:-./docker-volumes/proxy/nginx-proxy-manager/letsencrypt}:/etc/letsencrypt
