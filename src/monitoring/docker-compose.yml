services:
  glances:
    image: nicolargo/glances:latest-full
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:61208/api/4/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    pid: "host"
    networks:
      - proxiable
    read_only: true
    privileged: false
    volumes:
      - "/:/rootfs:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock:ro"
      - "/etc/os-release:/etc/os-release:ro"
      - "./config/glances.conf:/glances/conf/glances.conf"
    env_file:
      - path: .env
        required: false
    tmpfs:
      - /tmp
    environment:
      - GLANCES_OPT=${GLANCES_OPT:--C /glances/conf/glances.conf}
      - PYTHONPYCACHEPREFIX=${PYTHONPYCACHEPREFIX:-/tmp/py_caches}
    devices:
      - nvidia.com/gpu=all

  grafana:
    image: docker.io/grafana/grafana-oss
    container_name: grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana.ini:/etc/grafana/grafana.ini
      - ./config/provisioning/alerting:/etc/grafana/provisioning/alerting
      - ./config/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    env_file:
      - path: .env
        required: false
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_INSTANCE_NAME=${GF_INSTANCE_NAME:-Home Lab Monitoring}
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP:-false}
    restart: unless-stopped
    networks:
      - proxiable
      - metrics
    # ports:
    #   - "3000:3000"

  prometheus:
    image: docker.io/prom/prometheus
    container_name: prometheus
    command: "--config.file=/etc/prometheus/prometheus.yaml"
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - proxiable
      - metrics
    # ports:
    #   - "9090:9090"

  node_exporter:
    image: quay.io/prometheus/node-exporter
    container_name: node_exporter
    command: "--path.rootfs=/host"
    pid: host
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
    networks:
      - metrics
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /run:/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: unless-stopped
    networks:
      - metrics
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  metrics:
    driver: bridge
  proxiable:
    external: true

volumes:
  grafana-data:
  prometheus-data: