# Bind-mount override for Monitoring Stack (ADVANCED)
# Use this file for maximum flexibility - configure volume paths independently
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.bind.yml up -d
#
# Benefits:
#   - Store data in specific directories (local, NAS, cloud mount)
#   - Full control over storage location
#   - Can use network storage (NFS, CIFS/SMB)
#
# Note: Default paths match docker-compose.volumes.yml structure

services:
  grafana:
    volumes:
      - ${HOST_GRAFANA_DATA:-./docker-volumes/monitoring/grafana}:/var/lib/grafana

  prometheus:
    volumes:
      - ${HOST_PROMETHEUS_DATA:-./docker-volumes/monitoring/prometheus}:/prometheus
