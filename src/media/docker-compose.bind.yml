# Bind-mount override for Media Stack (ADVANCED)
# Use this file for maximum flexibility - configure each volume path independently
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.bind.yml up -d
#
# Benefits:
#   - Point different services to different drives/NAS shares
#   - Granular control over each service's storage location
#   - Can mix local and network storage per service
#
# Note: Paths match docker-compose.volumes.yml structure but allow per-service customization

services:
  wireguard:
    volumes:
      - ${HOST_WIREGUARD_CONFIG:-./docker-volumes/media/config/wireguard}:/config

  qbittorrent:
    volumes:
      - ${HOST_QBITTORRENT_CONFIG:-./docker-volumes/media/config/qbittorrent}:/config
      - ${HOST_MEDIA_DATA:-./docker-volumes/media/data}:/media

  prowlarr:
    volumes:
      - ${HOST_PROWLARR_CONFIG:-./docker-volumes/media/config/prowlarr}:/config

  lidarr:
    volumes:
      - ${HOST_LIDARR_CONFIG:-./docker-volumes/media/config/lidarr}:/config
      - ${HOST_MEDIA_DATA:-./docker-volumes/media/data}:/media

  radarr:
    volumes:
      - ${HOST_RADARR_CONFIG:-./docker-volumes/media/config/radarr}:/config
      - ${HOST_MEDIA_DATA:-./docker-volumes/media/data}:/media

  sonarr:
    volumes:
      - ${HOST_SONARR_CONFIG:-./docker-volumes/media/config/sonarr}:/config
      - ${HOST_MEDIA_DATA:-./docker-volumes/media/data}:/media

  fileflows:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOST_FILEFLOWS_TEMP:-./docker-volumes/media/fileflows/temp}:/temp
      - ${HOST_FILEFLOWS_DATA:-./docker-volumes/media/fileflows/data}:/app/Data
      - ${HOST_FILEFLOWS_COMMON:-./docker-volumes/media/fileflows/common}:/app/common
      - ${HOST_MEDIA_DATA:-./docker-volumes/media/data}:/media

  jellyfin:
    volumes:
      - ${HOST_JELLYFIN_CONFIG:-./docker-volumes/media/config/jellyfin}:/config
      - ${HOST_MEDIA_DATA:-./docker-volumes/media/data}:/media

  seerr:
    volumes:
      - ${HOST_SEERR_CONFIG:-./docker-volumes/media/config/seerr}:/app/config
