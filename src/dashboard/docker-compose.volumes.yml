# Override file for named volumes with custom path (recommended)
# Usage: docker compose -f docker-compose.yml -f docker-compose.volumes.yml up -d
#
# This uses Docker named volumes that point to a custom host path via local driver.
# Provides portability and easy migration between hosts.
#
# Configure path in .env file:
#   HOST_VOLUMES_DIR=/mnt/storage/docker-volumes
#
# Default path (if not set): ./docker-volumes

volumes:
  appdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOST_VOLUMES_DIR:-./docker-volumes}/dashboard/homarr
